<style>
:root{
  --bg:#0a0806; --bg-2:#110c08; --card:#16100a; --card-hi:#1c140c;

  --ink:#f6efdd; --ink-dim:#b6a888; --ink-faint:#7d735c;

}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--ink); font-family:'Cairo',sans-serif; line-height:1.7; overflow-x:hidden;}
h1,h2,h3,.display{font-family:'Aref Ruqaa', serif; font-weight:700; color:var(--gold-light);}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
button,input,textarea{font-family:inherit;}
button{cursor:pointer; border:none; background:none; color:inherit;}
::selection{background:var(--gold); color:#000;}
:focus-visible{outline:2px solid var(--gold-light); outline-offset:3px;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}

#stars{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.star{position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold-light); opacity:.15; animation:twinkle 4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.08; transform:scale(1);} 50%{opacity:.85; transform:scale(1.6);}}

.announce{background:var(--bg-2); border-bottom:1px solid var(--line); text-align:center; font-size:.82rem; color:var(--ink-dim); padding:9px 16px; position:relative; z-index:40;}
.announce b{color:var(--gold-light);}

header{position:sticky; top:0; z-index:50; background:rgba(10,8,6,.88); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);}
.nav{display:flex; align-items:center; justify-content:space-between; padding:12px 24px; gap:14px;}
.brand{display:flex; align-items:center; gap:12px;}
.brand img{width:42px; height:42px; border-radius:50%;}
.brand span{font-family:'Aref Ruqaa', serif; font-size:1.2rem; color:var(--gold-light);}
.nav-links{display:flex; gap:26px; font-size:.94rem; color:var(--ink-dim); flex:1; justify-content:center;}

[dir="ltr"] .nav-links a::after{right:auto; left:0;}
.nav-links a:hover{color:var(--gold-light);}
.nav-links a:hover::after{width:100%;}
.nav-actions{display:flex; align-items:center; gap:4px;}

.lang-btn{padding:6px 12px; border-radius:999px; font-size:.74rem; font-weight:700; color:var(--ink-faint); letter-spacing:.5px; transition:background .2s ease, color .2s ease;}
.lang-btn.active{background:var(--gold); color:#1a1206;}
.lang-btn:not(.active):hover{color:var(--gold-light);}
.view-switch{display:flex; gap:2px; border:1px solid var(--line); border-radius:999px; padding:3px; margin-inline-end:6px; background:var(--card-hi);}
.view-btn{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); transition:background .2s ease, color .2s ease;}
.view-btn svg{width:15px; height:15px;}
.view-btn.active{background:var(--gold); color:#1a1206;}

.view-switch-mobile{align-self:stretch; justify-content:space-between; padding:5px; margin-inline-end:0;}

.view-switch-mobile .view-btn svg{width:15px; height:15px;}

}

.cart-empty{color:var(--ink-faint); text-align:center; padding:60px 20px; font-size:.9rem;}
.cart-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
.cart-item-media{width:60px; height:60px; border-radius:var(--radius-sm); background:radial-gradient(circle at 50% 30%, #1e160c 0%, #0d0a06 75%); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
.cart-item-media img{width:100%; height:100%; object-fit:cover;}
.cart-item-media svg{width:55%; height:55%; opacity:.5;}
.cart-item-info{flex:1; min-width:0;}
.cart-item-info b{font-size:.88rem; display:block; margin-bottom:4px;}
.cart-item-info .price{font-size:.85rem;}
.qty-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
.qty-btn{width:24px; height:24px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.9rem;}
.qty-btn:hover{border-color:var(--gold);}
.remove-item{color:var(--wine-light); font-size:.78rem; margin-inline-start:auto;}
.cart-foot{padding:20px 22px 26px; border-top:1px solid var(--line);}
.cart-total-row{display:flex; justify-content:space-between; margin-bottom:16px; font-size:1rem;}
.cart-total-row b{color:var(--gold-light); font-family:'Aref Ruqaa',serif; font-size:1.2rem;}
.checkout-btn{width:100%; padding:14px; border-radius:999px; background:var(--whatsapp); color:#06210f; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;}
.checkout-btn:hover{transform:translateY(-2px);}

.qv-overlay{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:97; opacity:0; pointer-events:none; transition:opacity .3s ease; display:flex; align-items:center; justify-content:center; padding:20px;}
.qv-overlay.show{opacity:1; pointer-events:auto;}
.qv-modal{background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-lg); max-width:760px; width:100%; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; transform:scale(.95); transition:transform .3s ease; max-height:88vh;}
.qv-overlay.show .qv-modal{transform:scale(1);}
.qv-media{background:radial-gradient(circle at 50% 30%, #1e160c 0%, #0d0a06 75%); display:flex; align-items:center; justify-content:center; padding:30px; position:relative;}
.qv-media img{width:100%; border-radius:var(--radius-md);}
.qv-media svg{width:45%; height:45%; opacity:.5;}
.qv-close{position:absolute; top:14px; inset-inline-end:14px; width:34px; height:34px; border-radius:50%; background:rgba(10,8,6,.6); display:flex; align-items:center; justify-content:center; z-index:2;}
.qv-body{padding:30px; overflow-y:auto;}
.qv-body h3{font-size:1.35rem; margin-bottom:10px;}
.qv-body .desc{color:var(--ink-dim); font-size:.92rem; margin-bottom:18px;}
.qv-specs{display:flex; flex-direction:column; gap:8px; background:var(--card-hi); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:18px;}
.qv-spec-row{display:flex; justify-content:space-between; font-size:.86rem; color:var(--ink-dim);}
.qv-spec-row b{color:var(--gold-light); font-weight:600;}
.qv-wish{position:absolute; top:14px; inset-inline-start:14px; top:14px;}
.qv-wish.active svg{fill:var(--wine-light); stroke:var(--wine-light);}
.qv-body .price-row{margin-bottom:22px;}
.qv-body .price{font-size:1.4rem;}
.qv-actions{display:flex; flex-direction:column; gap:10px;}
.qv-actions .btn{justify-content:center;}

/* نموذج الطلب */
.form-overlay{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:98; opacity:0; pointer-events:none; transition:opacity .3s ease; display:flex; align-items:center; justify-content:center; padding:16px;}
.form-overlay.show{opacity:1; pointer-events:auto;}
.form-modal{background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-lg); max-width:460px; width:100%; max-height:90vh; overflow-y:auto; padding:28px; position:relative; transform:scale(.95); transition:transform .3s ease;}
.form-overlay.show .form-modal{transform:scale(1);}
.form-modal h3{font-size:1.3rem; margin-bottom:6px;}
.form-modal .form-sub{color:var(--ink-dim); font-size:.85rem; margin-bottom:22px;}
.form-close{position:absolute; top:16px; inset-inline-end:16px; width:32px; height:32px; border-radius:50%; background:var(--card-hi); display:flex; align-items:center; justify-content:center; color:var(--ink-dim);}
.field{margin-bottom:16px;}
.field label{display:block; font-size:.82rem; color:var(--ink-dim); margin-bottom:6px;}
.field input, .field textarea{
  width:100%; padding:12px 15px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-family:inherit; font-size:.9rem; resize:vertical;
}
.field input:focus, .field textarea:focus{border-color:var(--gold);}
.field-note{display:block; margin-top:6px; font-size:.76rem; color:var(--emerald-light);}
.readonly-box{
  width:100%; padding:12px 15px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--card-hi); color:var(--gold-light); font-size:.9rem; font-weight:600;
}
.form-submit{width:100%; padding:14px; border-radius:999px; background:var(--whatsapp); color:#06210f; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px;}
.form-submit:hover{transform:translateY(-2px);}

@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
@media (max-width: 900px){.foot-grid{grid-template-columns:1fr 1fr;} .trust .wrap{grid-template-columns:repeat(2,1fr);} .qv-modal{grid-template-columns:1fr;}}

  .hero img.logo-main{width:150px; height:150px;}
}
@media (max-width: 720px){.nav-links{display:none;} .burger{display:flex;} #langSwitch{display:none;} #viewSwitch{display:none;} .nav-cta span{display:none;} .nav-cta{padding:9px 12px;}}

function t(key){ return I18N[currentLang][key] || key; }
function fmt(n){ return n + (currentLang==="ar" ? " درهم" : " MAD"); }
function waLink(text){ return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`; }

/* ===================== تطبيق الترجمة ===================== */
function applyI18n(){
  const dict = I18N[currentLang];
  document.getElementById('htmlRoot').setAttribute('lang', currentLang);
  document.getElementById('htmlRoot').setAttribute('dir', dict.dir);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.getAttribute('data-i18n-ph');
    if(dict[key] !== undefined) el.setAttribute('placeholder', dict[key]);
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang===currentLang));
  const genLink = waLink(dict.waGeneral);
  ["navWa","heroWa","footWa","floatWa"].forEach(id => { const el=document.getElementById(id); if(el) el.href = genLink; });
  renderFilters();
  renderProducts();
  renderCart();
  renderFaq();
  if(pendingOrder){
    document.getElementById('fProductDisplay').textContent = pendingOrder.productText;
    document.getElementById('fPriceDisplay').textContent = fmt(pendingOrder.baseAmount);
  }
}

function setLang(lang){
  currentLang = lang;
  applyI18n();
}
document.getElementById('langSwitch').addEventListener('click', e => { const b=e.target.closest('.lang-btn'); if(b) setLang(b.dataset.lang); });
document.getElementById('langSwitchMobile').addEventListener('click', e => { const b=e.target.closest('.lang-btn'); if(b){ setLang(b.dataset.lang); closeMenu(); } });

/* ===================== الفلاتر والمنتجات ===================== */
const filtersEl = document.getElementById('filters');
const grid = document.getElementById('productGrid');

function catLabel(key){
  const map = { all:"filterAll", bags:"catBags", wallets:"catWallets", backpacks:"catBackpacks", accessories:"catAccessories" };
  return t(map[key]);
}
function renderFilters(){
  filtersEl.innerHTML = '';
  CATEGORY_KEYS.forEach(key => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (key===activeCat ? ' active' : '');
    chip.textContent = catLabel(key);
    chip.addEventListener('click', () => { activeCat = key; renderFilters(); renderProducts(); });
    filtersEl.appendChild(chip);
  });
}

function renderProducts(){
  grid.innerHTML = '';
  const min = parseFloat(document.getElementById('priceMin').value);
  const max = parseFloat(document.getElementById('priceMax').value);
  const list = PRODUCTS.filter(p => {
    if(activeCat!=='all' && p.category!==activeCat) return false;
    if(!isNaN(min) && p.price < min) return false;
    if(!isNaN(max) && p.price > max) return false;
    return true;
  });
  list.forEach(p => {
    const idx = PRODUCTS.indexOf(p);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="card-media">
        <div class="badges-row">
          ${p.badge==='new' ? `<span class="badge new">${currentLang==='ar'?'جديد':currentLang==='fr'?'Nouveau':'New'}</span>` : ''}
          ${p.badge==='sale' ? `<span class="badge sale">${currentLang==='ar'?'تخفيض':currentLang==='fr'?'Promo':'Sale'}</span>` : ''}
          ${p.badge==='bestseller' ? `<span class="badge bestseller">${currentLang==='ar'?'الأكثر مبيعاً':currentLang==='fr'?'Meilleure vente':'Bestseller'}</span>` : ''}
          ${(typeof p.stock==='number' && p.stock<=5) ? `<span class="badge stock">${currentLang==='ar'?'متبقي '+p.stock+' فقط':currentLang==='fr'?'Plus que '+p.stock:'Only '+p.stock+' left'}</span>` : ''}
        </div>
        <button class="wish-btn" data-idx="${idx}" aria-label="wishlist">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.5 8.2 2.3 4.5 6 4c2-.3 3.7.7 6 3 2.3-2.3 4-3.3 6-3 3.7.5 5.5 4.2 4 7.8-2.5 4.6-10 9.2-10 9.2Z"/></svg>
        </button>
        <button class="share-btn" data-idx="${idx}" aria-label="share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.7 15.8 6.3M8.2 13.3l7.6 4.4"/></svg>
        </button>
        ${p.image ? `<img src="${p.image}" alt="${p.name[currentLang]}" loading="lazy">` : bagIcon}
        <button class="quick-view" data-idx="${idx}">${t('quickView')}</button>
      </div>
      <div class="card-body">
        <h3>${p.name[currentLang]}</h3>
        <p class="desc">${p.desc[currentLang]}</p>
        <div class="card-foot">
          <div class="price-row">
            <span class="price">${fmt(p.price)}</span>
            ${p.oldPrice ? `<span class="old-price">${fmt(p.oldPrice)}</span>` : ''}
          </div>
        </div>
        <div class="card-actions">
          <button class="add-cart-btn" data-idx="${idx}">${t('addCart')}</button>
          <button class="order-btn" data-idx="${idx}" data-order="1">${t('orderNow')}</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
  document.querySelectorAll('.card').forEach(c => io.observe(c));
  bindProductButtons();
}

function shareProduct(idx){
  const p = PRODUCTS[idx];
  const text = `${p.name[currentLang]} — ${fmt(p.price)}\n${window.location.href}`;
  if(navigator.share){
    navigator.share({ title: p.name[currentLang], text }).catch(()=>{});
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }
}

function bindProductButtons(){
  document.querySelectorAll('.card').forEach(card => {
    card.style.cursor = 'pointer';
    card.onclick = () => openQuickView(parseInt(card.dataset.idx));
  });
  document.querySelectorAll('.wish-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const idx = btn.dataset.idx;
      if(wishlist.has(idx)){ wishlist.delete(idx); btn.classList.remove('active'); }
      else { wishlist.add(idx); btn.classList.add('active'); }
    };
  });
  document.querySelectorAll('.share-btn').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); shareProduct(parseInt(btn.dataset.idx)); }; });
  document.querySelectorAll('.add-cart-btn').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); addToCart(parseInt(btn.dataset.idx)); }; });
  document.querySelectorAll('.quick-view').forEach(btn => { btn.onclick = (e) => { e.stopPropagation(); openQuickView(parseInt(btn.dataset.idx)); }; });
  document.querySelectorAll('[data-order="1"]').forEach(btn => { const p = PRODUCTS[parseInt(btn.dataset.idx)]; btn.onclick = (e) => { e.stopPropagation(); openOrderForm(p.name[currentLang], p.price); }; });
}

const cartOverlay = document.getElementById('cartOverlay');
const cartItemsEl = document.getElementById('cartItems');
const cartCountEl = document.getElementById('cartCount');
const cartTotalEl = document.getElementById('cartTotal');

function addToCart(idx){
  const existing = cart.find(c => c.idx===idx);
  if(existing) existing.qty++;
  else cart.push({idx, qty:1});
  renderCart();
  openCart();
}
function changeQty(idx, delta){
  const item = cart.find(c => c.idx===idx);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) cart = cart.filter(c => c.idx!==idx);
  renderCart();
}
function renderCart(){
  const totalQty = cart.reduce((s,c)=>s+c.qty,0);
  cartCountEl.textContent = totalQty;
  cartCountEl.style.display = totalQty > 0 ? 'flex' : 'none';
  if(cart.length===0){
    cartItemsEl.innerHTML = `<div class="cart-empty">${t('cartEmpty')}<br>${t('cartEmptySub')}</div>`;
    cartTotalEl.textContent = fmt(0);
    return;
  }
  let total = 0;
  cartItemsEl.innerHTML = cart.map(c => {
    const p = PRODUCTS[c.idx];
    total += p.price * c.qty;
    return `
      <div class="cart-item">
        <div class="cart-item-media">${p.image ? `<img src="${p.image}" alt="${p.name[currentLang]}" loading="lazy">` : bagIcon}</div>
        <div class="cart-item-info">
          <b>${p.name[currentLang]}</b>
          <span class="price">${fmt(p.price)}</span>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty(${c.idx},-1)">−</button>
            <span>${c.qty}</span>
            <button class="qty-btn" onclick="changeQty(${c.idx},1)">+</button>
            <button class="remove-item" onclick="changeQty(${c.idx},-999)">×</button>
          </div>
        </div>
      </div>`;
  }).join('');
  cartTotalEl.textContent = fmt(total);
}
function openCart(){ cartDrawer.classList.add('open'); cartOverlay.classList.add('show'); }
function closeCart(){ cartDrawer.classList.remove('open'); cartOverlay.classList.remove('show'); }
document.getElementById('cartBtn').onclick = openCart;
document.getElementById('cartCloseBtn').onclick = closeCart;
cartOverlay.onclick = () => { closeCart(); closeMenu(); };

document.getElementById('checkoutBtn').onclick = () => {
  if(cart.length===0) return;
  const summary = cart.map(c => `${PRODUCTS[c.idx].name[currentLang]} × ${c.qty}`).join(', ');
  const total = cart.reduce((s,c) => s + PRODUCTS[c.idx].price * c.qty, 0);
  closeCart();
  openOrderForm(summary, total);
};

/* ===================== العرض السريع ===================== */
const qvOverlay = document.getElementById('qvOverlay');
let qvIdx = null;
function openQuickView(idx){
  qvIdx = idx;
  const p = PRODUCTS[idx];
  const isWished = wishlist.has(String(idx));
  document.getElementById('qvMedia').innerHTML = `
    <button class="qv-close" id="qvCloseBtn2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6efdd" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="wish-btn qv-wish${isWished ? ' active' : ''}" id="qvWishBtn" aria-label="wishlist">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.2C.5 8.2 2.3 4.5 6 4c2-.3 3.7.7 6 3 2.3-2.3 4-3.3 6-3 3.7.5 5.5 4.2 4 7.8-2.5 4.6-10 9.2-10 9.2Z"/></svg>
    </button>
    ${p.image ? `<img src="${p.image}" alt="${p.name[currentLang]}">` : bagIcon}`;
  document.getElementById('qvName').textContent = p.name[currentLang];
  document.getElementById('qvDesc').textContent = p.desc[currentLang];
  document.getElementById('qvDimVal').textContent = p.dimensions || '—';
  document.getElementById('qvColorVal').textContent = (p.color && p.color[currentLang]) || '—';
  document.getElementById('qvPrice').textContent = fmt(p.price);
  document.getElementById('qvOldPrice').textContent = p.oldPrice ? fmt(p.oldPrice) : '';
  document.getElementById('qvCloseBtn2').onclick = closeQuickView;
  document.getElementById('qvWishBtn').onclick = (e) => {
    const key = String(idx);
    if(wishlist.has(key)){ wishlist.delete(key); e.currentTarget.classList.remove('active'); }
    else { wishlist.add(key); e.currentTarget.classList.add('active'); }
  };
  qvOverlay.classList.add('show');
}
function closeQuickView(){ qvOverlay.classList.remove('show'); }
document.getElementById('qvCloseBtn').onclick = closeQuickView;
qvOverlay.addEventListener('click', e => { if(e.target===qvOverlay) closeQuickView(); });
document.getElementById('qvAddCart').onclick = () => { addToCart(qvIdx); closeQuickView(); };
document.getElementById('qvOrderBtn').onclick = () => { const p = PRODUCTS[qvIdx]; closeQuickView(); openOrderForm(p.name[currentLang], p.price); };

/* ===================== نموذج الطلب ===================== */
const formOverlay = document.getElementById('formOverlay');

function openOrderForm(productText, baseAmount){
  pendingOrder = { productText: productText || '', baseAmount: baseAmount || 0 };
  document.getElementById('fProductDisplay').textContent = pendingOrder.productText;
  document.getElementById('fPriceDisplay').textContent = fmt(pendingOrder.baseAmount);
  document.getElementById('fName').value = '';
  document.getElementById('fAddress').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fColor').value = '';
  document.getElementById('fCity').value = '';
  document.getElementById('fNotes').value = '';
  formOverlay.classList.add('show');
}
function closeOrderForm(){ formOverlay.classList.remove('show'); }
document.getElementById('formCloseBtn').onclick = closeOrderForm;
formOverlay.addEventListener('click', e => { if(e.target===formOverlay) closeOrderForm(); });

document.getElementById('orderForm').addEventListener('submit', e => {
  e.preventDefault();
  const dict = I18N[currentLang];
  const name = document.getElementById('fName').value.trim();
  const address = document.getElementById('fAddress').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const color = document.getElementById('fColor').value.trim();
  const city = document.getElementById('fCity').value.trim();
  const notes = document.getElementById('fNotes').value.trim();

  let msg = `✨ ${dict.waOrderTitle} — Moon Blossom\n\n`;
  msg += `${dict.waProduct}: ${pendingOrder.productText}\n`;
  msg += `${dict.waPrice}: ${fmt(pendingOrder.baseAmount)}\n`;
  msg += `${dict.waColor}: ${color}\n\n`;
  msg += `${dict.waName}: ${name}\n`;
  msg += `${dict.waAddress}: ${address}\n`;
  msg += `${dict.waPhone}: ${phone}\n`;
  msg += `${dict.waCity}: ${city}\n`;
  if(notes) msg += `\n${dict.waNotes}: ${notes}\n`;

  window.open(waLink(msg), '_blank');
  closeOrderForm();
});

/* ===================== القائمة الجانبية للجوال ===================== */
const mobileMenu = document.getElementById('mobileMenu');
const menuOverlay = document.getElementById('menuOverlay');
function openMenu(){ mobileMenu.classList.add('open'); menuOverlay.classList.add('show'); }
function closeMenu(){ mobileMenu.classList.remove('open'); menuOverlay.classList.remove('show'); }

menuOverlay.onclick = closeMenu;

/* ===================== الأسئلة الشائعة ===================== */
const faqList = document.getElementById('faqList');
function renderFaq(){
  faqList.innerHTML = '';
  FAQS.forEach(f => {
    const item = document.createElement('div');
    item.className = 'faq-item';
    item.innerHTML = `
      <div class="faq-q">${f.q[currentLang]}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
      <div class="faq-a"><p>${f.a[currentLang]}</p></div>`;
    const q = item.querySelector('.faq-q');
    const a = item.querySelector('.faq-a');
    q.addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(el => { el.classList.remove('open'); el.querySelector('.faq-a').style.maxHeight = null; });
      if(!isOpen){ item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
    });
    faqList.appendChild(item);
  });
}

/* ===================== النشرة البريدية ===================== */
document.getElementById('newsForm').addEventListener('submit', e => {
  e.preventDefault();
  document.getElementById('newsInput').value = '';
  const btn = document.getElementById('newsBtn');

const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('show'); });
}, {threshold:.15});

/* ===================== تبديل العرض اليدوي (جوال / حاسوب) =====================
   نفس تقنية "طلب نسخة سطح المكتب" في المتصفحات: تغيير عرض viewport الفعلي
   بدل استخدام CSS قسري، لتفادي تداخل عناصر الهيدر وقائمة الجوال. */
const viewportMeta = document.getElementById('viewportMeta');
const allViewSwitches = document.querySelectorAll('.view-switch');
let currentView = null; // null = تلقائي حسب الجهاز

function setForcedView(mode){
  currentView = mode;
  closeMenu();
  if(mode === 'desktop'){
    viewportMeta.setAttribute('content', 'width=1180');
  } else if(mode === 'mobile'){
    viewportMeta.setAttribute('content', 'width=390');
  } else {
    viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0');
  }
  allViewSwitches.forEach(sw => sw.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view===mode)));
}
allViewSwitches.forEach(sw => sw.addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if(!btn) return;
  const mode = btn.dataset.view;
  setForcedView(currentView===mode ? null : mode);
}));

/* ===================== فلتر السعر ===================== */
let priceDebounce;
["priceMin","priceMax"].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    clearTimeout(priceDebounce);
    priceDebounce = setTimeout(renderProducts, 300);
  });
});

applyI18n();
